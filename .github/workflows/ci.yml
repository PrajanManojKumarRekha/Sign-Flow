name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ml:
    name: Python (ml/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install pytest ruff==0.17.0 pyyaml numpy opencv-python-headless
      - run: ruff check .
      - run: pytest

  web:
    name: Engine + web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
